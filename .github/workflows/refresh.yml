name: Refresh OpenAPI specs

# Pulls the three live /openapi.json endpoints, rewrites specs/*.json,
# commits any changes (so the deploy.yml workflow picks them up).
#
# Triggered:
#   - Daily at 06:00 UTC (08:00 Europe/Copenhagen — early enough to be fresh
#     by the time any reader is awake)
#   - On manual dispatch (after a backend service deploys, hit:
#       gh workflow run refresh.yml -R paer-aps/paer-docs)
#
# A future improvement: have each service's deploy.yml fire a
# `workflow_dispatch` event here via the gh CLI so refresh is automatic.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed for `gh workflow run deploy.yml` chaining

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # continue-on-error, then a hard fail at the end: a service whose spec
      # could not be refreshed must not stop the services that COULD be
      # published, but the run still has to go red. Silence is what let the
      # published specs sit frozen from 2026-07-18 to 2026-08-19 while every
      # run reported success (#108).
      - name: Refresh specs
        id: refresh
        continue-on-error: true
        run: ./scripts/refresh_specs.sh

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet specs/; then
            echo "no spec changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add specs/
          git commit -m "chore: refresh OpenAPI specs $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GitHub deliberately does NOT trigger workflows from commits made
      # using GITHUB_TOKEN (loop prevention). So the auto-commit above won't
      # fire deploy.yml on its own — we trigger it explicitly here.
      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml

      # Last, so a partial refresh still publishes what it could. A red
      # scheduled run is what actually reaches a human: GitHub emails the
      # repo owner on scheduled-workflow failure, and a run that keeps
      # failing is visible in a way a run that quietly does nothing is not.
      - name: Fail the run if any spec could not be refreshed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error title=Spec refresh incomplete::One or more services did not serve /openapi.json — docs.paer.dk is serving stale specs. See the 'Refresh specs' step for which, and meta #108 for the ENABLE_DOCS root cause."
          exit 1
