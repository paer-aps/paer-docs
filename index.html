<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paer API Reference</title>
<meta name="description" content="Reference documentation for the paer.dk B2B payments platform — quotes, identity/KYB, and counterparty/screening services.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📄%3C/text%3E%3C/svg%3E">
<style>
  body { margin: 0; }
</style>
<!-- Load Scalar's bundle BEFORE we call into it -->
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</head>
<body>
<div id="api-reference"></div>
<script>
  // Multi-source rendering requires the programmatic JS API.
  // The JSON-in-script-tag pattern only supports single-spec mode and
  // ignores `sources` arrays — see scalar/scalar configuration docs.
  Scalar.createApiReference('#api-reference', {
    theme: 'default',
    layout: 'modern',
    showSidebar: true,
    hideClientButton: false,
    hideDownloadButton: false,
    metaData: {
      title: 'Paer API Reference',
      description: 'API reference for paer.dk — quotes, identity, beneficiaries',
    },
    sources: [
      {
        url: 'specs/quotes.json',
        title: 'Quotes API',
        slug: 'quotes',
        default: true,
      },
      {
        url: 'specs/user.json',
        title: 'User API',
        slug: 'user',
      },
      {
        url: 'specs/beneficiary.json',
        title: 'Beneficiary API',
        slug: 'beneficiary',
      },
      {
        url: 'specs/cvr.json',
        title: 'CVR API',
        slug: 'cvr',
      },
    ],
  });
</script>
</body>
</html>
